<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt library - Ekphrasis Prompt Bench</title>
<style>
:root { --bg:#f4f2ee; --panel:#fff; --line:#ddd8cf; --muted:#7a756c; --fg:#24221f; --accent:#2f5d8a; --accent-soft:#dfe7f0; --soft:#ece8e1; }
@media (prefers-color-scheme: dark) { :root { --bg:#1d1c1a; --panel:#262522; --line:#3a3833; --muted:#9a948a; --fg:#ece8e1; --accent:#6f9fd0; --accent-soft:#2a3442; --soft:#302e2a; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui, "Segoe UI", sans-serif; }
header { padding:12px 18px 0; background:var(--panel); border-bottom:2px solid var(--accent); }
h1 { font-size:20px; margin:0 0 2px; } .sub { color:var(--muted); font-size:13px; margin-bottom:8px; }
.tabs { display:flex; gap:4px; }
.tabs button { font:600 14px system-ui; padding:7px 16px 6px; border:1px solid var(--line); border-bottom:none; border-radius:9px 9px 0 0;
  background:var(--soft); color:var(--muted); cursor:pointer; margin-bottom:-2px; }
.tabs button.on { background:var(--accent-soft); color:var(--fg); border-color:var(--accent); border-bottom:2px solid var(--accent-soft); }
.bar { display:flex; gap:8px; align-items:center; padding:10px 18px; background:var(--accent-soft); border-bottom:1px solid var(--line); flex-wrap:wrap; }
.bar input[type=text], .bar select { padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:var(--fg); }
#q { flex:1; min-width:200px; }
button.b { padding:4px 10px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:var(--fg); cursor:pointer; font-size:13px; }
button.b.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
main { padding:10px 18px 60px; }
.row { display:grid; grid-template-columns:22px 1fr 150px; gap:10px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; margin:8px 0; }
.row .txt { white-space:pre-wrap; }
.meta { color:var(--muted); font-size:12px; margin-top:6px; }
.chip { display:inline-block; font-size:11.5px; padding:0 7px; border-radius:9px; background:var(--soft); margin:2px 3px 0 0; }
.chip.tag { background:var(--accent-soft); }
.ref img { width:150px; height:150px; object-fit:cover; border-radius:6px; border:1px solid var(--line); }
.ref .muted { font-size:11px; color:var(--muted); }
.acts { display:flex; gap:4px; margin-top:6px; flex-wrap:wrap; }
.acts button { font-size:12px; padding:1px 8px; }
.on-great { background:#d9a520 !important; color:#fff !important; } .on-ok { background:var(--accent) !important; color:#fff !important; } .on-duff { background:#a33 !important; color:#fff !important; }
table { border-collapse:collapse; margin:8px 0 18px; background:var(--panel); }
th, td { border:1px solid var(--line); padding:4px 10px; text-align:left; font-size:13px; }
th { background:var(--soft); }
h3 { margin:16px 0 4px; font-size:14px; }
.empty { color:var(--muted); padding:30px 0; }
#toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--fg); color:var(--bg); padding:8px 14px; border-radius:8px; display:none; }
</style></head>
<body>
<header>
  <h1>Prompt library</h1>
  <div class="sub">Prompts you graded in Review or on the Photobash / Ideas / Rewrite cards. The grade belongs to the prompt text.
    <b>Great</b> prompts are the library; <b>duff</b> prompts are hidden from new lists but kept here as the counterpoint for forensics.</div>
  <div class="tabs" id="tabs">
    <button data-g="great">&#9733; Great <span id="n-great"></span></button>
    <button data-g="ok">&#10003; OK <span id="n-ok"></span></button>
    <button data-g="duff">&#10007; Duff archive <span id="n-duff"></span></button>
    <button data-g="forensics">&#9881; Forensics</button>
  </div>
</header>
<div class="bar" id="bar">
  <input type="text" id="q" placeholder="search the prompts">
  <select id="tag"><option value="">all tags</option></select>
  <label><input type="checkbox" id="all"> tick all shown</label>
  <input type="text" id="name" placeholder="list name (prompt lists folder)" style="width:220px">
  <button class="b primary" id="export" title="Save the ticked prompts (or all shown when none are ticked) as a prompt list">Export as list</button>
  <button class="b" id="copy" title="Copy the ticked (or all shown) prompts, one per line">Copy</button>
  <span id="info" style="color:var(--muted);font-size:12.5px"></span>
</div>
<main id="main"></main>
<div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const thumb = (p, side) => `/thumb?side=${side}&path=${encodeURIComponent(p)}`;
const toast = (m, ms = 3000) => { const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = "none", ms); };
async function api(u, body) {
  const r = await fetch(u, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  const d = await r.json(); if (!r.ok || d.error) throw new Error(d.error || r.statusText); return d;
}
const L = {grade: "great", rows: [], picked: new Set()};
function setTab(g) {
  L.grade = g; L.picked.clear(); $("#all").checked = false;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.g === g));
  $("#bar").style.display = g === "forensics" ? "none" : "";
  (g === "forensics" ? loadForensics() : load()).catch(e => toast(e.message, 6000));
}
async function load() {
  const d = await api(`/api/library?grade=${L.grade}&q=${encodeURIComponent($("#q").value.trim())}&tag=${encodeURIComponent($("#tag").value)}`);
  L.rows = d.rows;
  for (const g of ["great", "ok", "duff"]) $("#n-" + g).textContent = d.counts[g] ? `(${d.counts[g]})` : "";
  const cur = $("#tag").value;
  $("#tag").innerHTML = '<option value="">all tags</option>' + d.tags.map(([t, n]) => `<option value="${esc(t)}">${esc(t)} (${n})</option>`).join("");
  $("#tag").value = cur;
  $("#info").textContent = `${d.total} prompt(s)`;
  $("#main").innerHTML = d.rows.length ? d.rows.map(r => {
    const p = r.provenance || {};
    const prov = [p.variant, p.model && p.model.split(/[\\/]/).pop(), p.preset && "preset " + p.preset, p.sweep && "sweep " + p.sweep, p.checkpoint].filter(Boolean).map(esc).join(" &middot; ");
    const img = r.reference || p.source_image;
    return `<div class="row" data-sha="${r.sha}"><input type="checkbox" data-pick="${r.sha}" ${L.picked.has(r.sha) ? "checked" : ""}>
      <div><div class="txt">${esc(r.prompt)}</div>
        <div>${r.tags.map(t => `<span class="chip tag">${esc(t)}</span>`).join("")}${r.reasons.map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div>
        <div class="meta">${prov || "no provenance"} &middot; graded ${esc((r.updated || "").replace("T", " "))}</div>
        <div class="acts">${["great", "ok", "duff"].map(g => `<button class="b ${r.grade === g ? "on-" + g : ""}" data-regrade="${g}">${{great: "&#9733; great", ok: "&#10003; ok", duff: "&#10007; duff"}[g]}</button>`).join("")}
          <button class="b" data-copy1>copy</button><button class="b" data-ungrade title="Remove the grade (the prompt is no longer in the library or the archive)">remove grade</button></div></div>
      <div class="ref">${img ? `<a href="${thumb(img, 2000)}" target="_blank"><img src="${thumb(img, 300)}" alt=""></a><div class="muted">${r.reference ? "reference render" : "source image"}</div>` : ""}</div></div>`;
  }).join("") : `<div class="empty">${L.grade === "great" ? "No great prompts yet - grade prompts in Review (g / o / d) or with the &#9733; on cards." : "Nothing here yet."}</div>`;
}
async function loadForensics() {
  const d = await api("/api/library/forensics");
  const tbl = (title, obj) => {
    const rows = Object.entries(obj); if (!rows.length) return "";
    return `<h3>${title}</h3><table><tr><th></th><th>&#9733; great</th><th>&#10003; ok</th><th>&#10007; duff</th><th>great rate</th></tr>${rows.map(([k, c]) => {
      const n = (c.great || 0) + (c.ok || 0) + (c.duff || 0);
      return `<tr><td>${esc(k)}</td><td>${c.great || 0}</td><td>${c.ok || 0}</td><td>${c.duff || 0}</td><td>${n ? Math.round(100 * (c.great || 0) / n) + "%" : ""}</td></tr>`; }).join("")}</table>`;
  };
  const m = d.measures;
  const meas = Object.keys(m).length ? `<h3>Text measures</h3><table><tr><th></th><th>prompts</th><th>avg words</th><th>avg sentences</th></tr>${["great", "ok", "duff"].filter(g => m[g]).map(g =>
    `<tr><td>${g}</td><td>${m[g].n}</td><td>${m[g].words}</td><td>${m[g].sentences}</td></tr>`).join("")}</table>` : "";
  const rs = Object.entries(d.reasons).filter(([, v]) => v.length).map(([g, v]) => `<h3>Reasons given: ${g}</h3><div>${v.map(([r, n]) => `<span class="chip">${esc(r)} &times;${n}</span>`).join("")}</div>`).join("");
  $("#main").innerHTML = (tbl("By variant (preset version, photobash mode, ideas mode, rewrite operation)", d.by_variant) + tbl("By model", d.by_model) + meas + rs)
    || '<div class="empty">Grade some prompts first - forensics compares great, ok and duff.</div>';
}
function chosen() { return L.rows.filter(r => !L.picked.size || L.picked.has(r.sha)); }
document.addEventListener("click", async e => {
  const t = e.target, row = t.closest(".row");
  try {
    if (t.closest("#tabs button")) setTab(t.closest("#tabs button").dataset.g);
    else if (t.dataset.regrade && row) { const r = L.rows.find(x => x.sha === row.dataset.sha);
      await api("/api/pgrade", {prompt: r.prompt, grade: t.dataset.regrade}); toast(`graded ${t.dataset.regrade}`); await load(); }
    else if (t.hasAttribute("data-ungrade") && row) { const r = L.rows.find(x => x.sha === row.dataset.sha);
      if (!confirm("Remove the grade from this prompt?")) return; await api("/api/pgrade", {prompt: r.prompt, grade: null}); await load(); }
    else if (t.hasAttribute("data-copy1") && row) { await navigator.clipboard.writeText(L.rows.find(x => x.sha === row.dataset.sha).prompt); toast("copied"); }
    else if (t.id === "copy") { const rows = chosen(); await navigator.clipboard.writeText(rows.map(r => r.prompt).join("\n")); toast(`copied ${rows.length} prompt(s)`); }
    else if (t.id === "export") { const rows = chosen(); if (!rows.length) return toast("nothing to export");
      const d = await api("/api/library/export", {grade: L.grade, shas: rows.map(r => r.sha), name: $("#name").value.trim() || `library_${L.grade}`, fmt: "lines", on_exists: "new", dedupe: true, sidecar: true});
      toast(`saved ${d.added} prompt(s) as ${d.file}`, 6000); }
  } catch (err) { toast(err.message, 6000); }
});
document.addEventListener("change", e => {
  if (e.target.dataset.pick) { e.target.checked ? L.picked.add(e.target.dataset.pick) : L.picked.delete(e.target.dataset.pick); }
  if (e.target.id === "all") { L.picked = e.target.checked ? new Set(L.rows.map(r => r.sha)) : new Set(); document.querySelectorAll("[data-pick]").forEach(c => c.checked = e.target.checked); }
  if (e.target.id === "tag") load().catch(err => toast(err.message));
});
let qt; $("#q").addEventListener("input", () => { clearTimeout(qt); qt = setTimeout(() => load().catch(err => toast(err.message)), 300); });
setTab(new URLSearchParams(location.search).get("grade") || "great");
</script>
</body></html>
